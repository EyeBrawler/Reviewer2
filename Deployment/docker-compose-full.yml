version: "3.9"

services:
  db:
    image: postgres:15
    container_name: reviewer2-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"  # Avoid conflict with native Postgres
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: reviewer2-app
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Reviewer2Connection: ${REVIEWER2_CONNECTION}
    depends_on:
      - db

volumes:
  db_data: